name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "ai-virtual-phone-main/android-shell/**"
      - ".github/workflows/android-shell.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Check site URL
        run: |
          if [ -z "$SHELL_SITE_URL" ]; then
            echo "::error::请先在仓库 Variables 配置 SHELL_SITE_URL，或手动运行工作流时填写 site_url"
            exit 1
          fi

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p ai-virtual-phone-main/android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: ai-virtual-phone-main/android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: ai-virtual-phone-main/android-shell/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
